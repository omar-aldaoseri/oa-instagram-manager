name: Token health check

# Every Monday: confirms the Instagram token still works.
# If it fails, GitHub emails you, so you can renew the token before posts are missed.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ask Instagram which account this token belongs to
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python3 - <<'EOF'
          import os, sys
          sys.path.insert(0, "scripts")
          from publish import Api
          tok = os.environ.get("IG_ACCESS_TOKEN", "").strip()
          if not tok:
              sys.exit("IG_ACCESS_TOKEN secret is missing")
          api = Api(tok)
          ig = os.environ.get("IG_USER_ID", "").strip() or api.find_ig_id()
          print(f"Token works for @{api.whoami(ig)} (account {ig}) via {api.base}")
          EOF
